[project]
name = "release-reliability-lab"
version = "0.1.0"
description = "Local black-box release gates, failure drills, and rollback evidence"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
reliability-lab = "reliability_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reliability_lab"]

[tool.hatch.build.targets.wheel.force-include]
"static" = "reliability_lab/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: launches actual sibling portfolio services"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

